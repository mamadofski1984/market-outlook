name: Build Pages branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES_EXPORT: "1"
      - name: Publish the demo files to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/market-outlook-site"
          mv out "$site"
          if git ls-remote --exit-code --heads origin refs/heads/gh-pages; then
            git fetch origin gh-pages
            git switch --create gh-pages --track origin/gh-pages
            git rm -r --ignore-unmatch .
          else
            git switch --orphan gh-pages
          fi
          cp -a "$site"/. .
          touch .nojekyll
          git add --all -- .nojekyll _next _not-found 404 fonts images markets *.html *.svg *.txt
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish dashboard demo"
          fi
          git push origin HEAD:gh-pages
